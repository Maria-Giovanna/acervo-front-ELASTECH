<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta – Acervo</title>
    <meta name="description" content="Crie sua conta no Acervo para reservar equipamentos.">

    <!-- aplica tema, tamanho do texto e cores ANTES de desenhar a página -->
    <script src="js/core/preferencias.js"></script>

    <!-- fontes: Archivo (títulos) e Atkinson Hyperlegible Next (texto, feita para baixa visão) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS: sistema (base) → peças (componentes) → página -->
    <link rel="stylesheet" href="css/base/tokens.css">
    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/tipografia.css">
    <link rel="stylesheet" href="css/base/layout.css">
    <link rel="stylesheet" href="css/componentes/botoes.css">
    <link rel="stylesheet" href="css/componentes/cartao.css">
    <link rel="stylesheet" href="css/componentes/formularios.css">
    <link rel="stylesheet" href="css/componentes/selos.css">
    <link rel="stylesheet" href="css/componentes/estados.css">
    <link rel="stylesheet" href="css/componentes/avisos.css">
    <link rel="stylesheet" href="css/componentes/cabecalho.css">
    <link rel="stylesheet" href="css/componentes/rodape.css">
    <link rel="stylesheet" href="css/paginas/entrar.css">
</head>
<body data-pagina="criar-conta">

<header id="cabecalho"></header>

<main id="conteudo" class="pagina">
    <section class="entrar">
        <div class="entrar__texto">
            <p class="selo-secao">Acesso</p>
            <h1 class="titulo-secao">Crie sua conta</h1>
            <p>Com nome, e-mail e uma senha você já entra e pode reservar. É um equipamento por vez, por até 14 dias.</p>
        </div>

        <form class="cartao formulario" id="form-criar-conta" novalidate>
            <div class="campo">
                <label for="nome">Nome</label>
                <input class="campo__entrada" id="nome" name="nome" autocomplete="name" aria-describedby="nome-erro">
                <p class="campo__erro" id="nome-erro" hidden></p>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input class="campo__entrada" id="email" name="email" type="email" autocomplete="email" inputmode="email" aria-describedby="email-erro">
                <p class="campo__erro" id="email-erro" hidden></p>
            </div>

            <div class="campo">
                <label for="cargo">Cargo <span class="campo__dica">(opcional)</span></label>
                <input class="campo__entrada" id="cargo" name="cargo" autocomplete="organization-title">
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo__senha">
                    <input class="campo__entrada" id="senha" name="senha" type="password" autocomplete="new-password" aria-describedby="regras-senha senha-erro">
                    <button class="campo__mostrar" id="mostrar-senha" type="button" aria-pressed="false" aria-controls="senha">Mostrar</button>
                </div>
                <ul class="regras-senha" id="regras-senha" aria-live="polite"></ul>
                <p class="campo__erro" id="senha-erro" hidden></p>
            </div>

            <p class="alerta alerta--erro" id="alerta-erro" role="alert" hidden></p>

            <button class="botao botao--primario botao--largo" id="botao-criar-conta" type="submit">Criar conta</button>

            <p class="formulario__troca">Já tem conta? <a id="link-entrar" href="entrar.html">Entrar</a></p>
        </form>
    </section>
</main>

<footer id="rodape"></footer>

<!-- JS: primeiro o que os outros usam; por último, o arquivo da página -->
<script src="js/core/config.js"></script>
<script src="js/core/utilidades.js"></script>
<script src="js/dados/icones.js"></script>
<script src="js/dados/produtos.js"></script>
<script src="js/core/sessao.js"></script>
<script src="js/componentes/avisos.js"></script>
<script src="js/core/api.js"></script>
<script src="js/componentes/cabecalho.js"></script>
<script src="js/componentes/acessibilidade.js"></script>
<script src="js/componentes/campos.js"></script>
<script src="js/core/validacao.js"></script>
<script src="js/componentes/regras-senha.js"></script>
<script src="js/paginas/criar-conta.js"></script>
</body>
</html>
